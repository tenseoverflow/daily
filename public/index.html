<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily</title>
    <meta
      name="description"
      content="Daily — your Estonian morning news digest from Äripäev, Delfi, and ERR."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="brand">Daily</p>
      <h1 class="headline">The morning, already read for you.</h1>
      <p class="lede">
        Ranked headlines from Äripäev, Delfi, and ERR — scraped, summarized, ready at nine.
      </p>
      <div class="cta-row">
        <button type="button" id="refresh-btn" class="btn primary">Open today’s digest</button>
        <button type="button" id="run-btn" class="btn ghost">Run now</button>
      </div>
      <p class="meta" id="status-line">Loading…</p>
    </header>

    <main id="app" class="digest" hidden>
      <section class="overview-block">
        <h2>Overview</h2>
        <p id="overview"></p>
      </section>
      <section class="stories">
        <h2>Top stories</h2>
        <ol id="stories"></ol>
      </section>
    </main>

    <section id="empty" class="empty" hidden>
      <h2>No digest yet</h2>
      <p>Trigger a run, or wait for the 09:00 Europe/Tallinn cron.</p>
    </section>

    <footer class="foot">
      <span>Personal digest · not affiliated with the publishers</span>
      <select id="date-select" aria-label="Past digests"></select>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
